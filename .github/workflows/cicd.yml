name: cicd


on:
     workflow_dispatch:
jobs:
       code:
            runs-on: ubuntu-latest
            steps:
            - name: clone code
              run: echo "clone code"
       build:
             needs: [code]
             runs-on: ubuntu-latest
             steps:
             - name: docker build 
               run: echo "docker build"
       tester:
              needs: [build]
              runs-on: ubuntu-latest
              steps:
              - name: running test cases
                run: echo "testing the app"
       deploy:
              needs: [build,tester]
              runs-on: ubuntu-latest
              steps:
              - name: deploying on the machine
                run: echo "deploying the app"
              - name: verify deployment
                run: |
                  python3 -m http.server 8080 --directory /tmp >/tmp/http.log 2>&1 &
                  SERVER_PID=$!
                  trap "kill $SERVER_PID 2>/dev/null || true" EXIT
                  sleep 1
                  curl -fsS http://127.0.0.1:8080 >/dev/null
                  echo "deployment verified"
