name: cicd


on:
     workflow_dispatch:
jobs:
       code:
            runs-on: ubuntu-latest
            steps:
            - name: clone code
              run: echo "clone code"
       build:
             needs: [code]
             runs-on: ubuntu-latest
             steps:
             - name: docker build 
               run: echo "docker build"
       tester:
              needs: [build]
              runs-on: ubuntu-latest
              steps:
              - name: running test cases
                run: echo "testing the app"
       deploy:
              needs: [build,tester]
              runs-on: ubuntu-latest
              steps:
              - name: deploying on the machine
                run: echo "deploying the app"
          
        
